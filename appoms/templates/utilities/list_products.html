{% if current_user.is_authenticated %}
{% extends "base.html" %}
{% block content %}
<div class="probp-div">
	{% if products %}
	{% for product in products %}
	<h3><a href="{{ url_for('list_utils.get_product', product_name=product.product_name) }}">{{ product.product_name }}</a>.</h3>
	{% endfor %}
	{% endif %}
</div>
{% endblock content %}
{% endif %}
