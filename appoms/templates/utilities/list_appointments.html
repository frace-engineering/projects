{% if current_user.is_authenticated %}
{% extends "base.html" %}
{% block content %}
<div class="probp-div">
	{% if appointments %}
	{% for appointment in appointments %}
	<h3><a href="{{ url_for('list_utils.get_appointment', appointment_date=appointment.appointment_date) }}">{{ appointment.appointment_date }}</a>.</h3>
	{% endfor %}
	{% endif %}
	</div>
{% endblock content %}
{% endif %}
